<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doggy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600;800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030009;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            perspective: 1200px;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }

        /* Center Name Typography */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }

        .name-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.2rem, 8.5vw, 6.8rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            white-space: nowrap;
            transition: text-shadow 0.4s ease;
            filter: drop-shadow(0 0 25px rgba(255, 45, 117, 0.85));
        }

        .sub-message {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1rem, 2.8vw, 1.6rem);
            margin-top: -6px;
            color: #ffd1e4;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.9);
            opacity: 0.95;
            animation: floatSub 3s ease-in-out infinite alternate;
        }

        @keyframes floatSub {
            0% { transform: translateY(0); }
            100% { transform: translateY(-7px); }
        }

        /* Floating Words popping up */
        .floating-word {
            position: absolute;
            pointer-events: none;
            z-index: 6;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 1.6rem;
            animation: floatUpWord 1.8s ease-out forwards;
            white-space: nowrap;
        }

        @keyframes floatUpWord {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.6);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -20px) scale(1.15);
            }
            80% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -90px) scale(1.3);
            }
        }

        /* Bottom Controls */
        .controls {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 50px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 45, 117, 0.45);
            border-color: rgba(255, 105, 180, 0.8);
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Top Hint */
        .top-hint {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            z-index: 8;
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
            animation: breatheHint 4s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        @keyframes breatheHint {
            0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(0.98); }
            50% { opacity: 0.95; transform: translateX(-50%) scale(1.02); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="top-hint">Click</div>

    <div class="center-container" id="centerContainer">
        <div class="name-title" id="nameTitle">Nhã Thi</div>
        <div class="sub-message">nha thi yeu em</div>
    </div>

    <div class="controls">
        <button class="btn" id="themeBtn">Đổi Màu Sắc</button>
        <button class="btn" id="superBeatBtn">Nhịp Đập Cực Đại</button>
        <button class="btn" id="confettiBtn">Bão Trái Tim</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nameTitle = document.getElementById('nameTitle');
        const centerContainer = document.getElementById('centerContainer');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init3DHeart();
        });

        // ================= LOAD CUSTOM ICON =================
        const customIconImg = new Image();
        let isIconLoaded = false;
        customIconImg.src = 'custom_icon.jpg';
        customIconImg.onload = () => { isIconLoaded = true; };
        customIconImg.onerror = () => {
            // Fallback to online CDN if local path fails
            customIconImg.src = 'https://cdn.discordapp.com/attachments/1397591804034945034/1562070618986254458/Messenger_creation_04EE70A1-E6E7-4AC7-B5EC-89588DED9117.jpg?ex=6ad8a721&is=6ad755a1&hm=9cd4c1ef6bf29f7c310cab20bf81ae88ae405b570a166313dad8fb361eb08276&';
            customIconImg.onload = () => { isIconLoaded = true; };
        };

        // ================= PALETTES / THEMES =================
        const themes = [
            {
                name: 'Neon Pink Love',
                primary: '#ff2d75',
                secondary: '#ff75a0',
                core: '#ffffff',
                glow: 'rgba(255, 45, 117, 0.9)',
                shadow: 'rgba(255, 20, 147, 0.95)'
            },
            {
                name: 'Cyber Romance',
                primary: '#00f2fe',
                secondary: '#4facfe',
                core: '#ffffff',
                glow: 'rgba(0, 242, 254, 0.9)',
                shadow: 'rgba(0, 180, 255, 0.95)'
            },
            {
                name: 'Passionate Flame',
                primary: '#ff416c',
                secondary: '#ff4b2b',
                core: '#ffeaa7',
                glow: 'rgba(255, 65, 108, 0.9)',
                shadow: 'rgba(255, 75, 43, 0.95)'
            },
            {
                name: 'Galaxy Violet',
                primary: '#c084fc',
                secondary: '#e879f9',
                core: '#fdf2f8',
                glow: 'rgba(192, 132, 252, 0.9)',
                shadow: 'rgba(168, 85, 247, 0.95)'
            },
            {
                name: 'Emerald Dream',
                primary: '#10b981',
                secondary: '#34d399',
                core: '#ecfdf5',
                glow: 'rgba(16, 185, 129, 0.9)',
                shadow: 'rgba(5, 150, 105, 0.95)'
            }
        ];

        let currentThemeIndex = 0;
        let curTheme = themes[0];

        function applyTheme(th) {
            curTheme = th;
            nameTitle.style.textShadow = `
                0 0 10px #ffffff,
                0 0 25px ${th.secondary},
                0 0 50px ${th.primary},
                0 0 85px ${th.glow}
            `;
            nameTitle.style.filter = `drop-shadow(0 0 25px ${th.primary})`;
        }
        applyTheme(curTheme);

        // ================= VOLUMETRIC 3D HEART MODEL =================
        function heart2DCurve(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        let heartParticles = [];
        const PARTICLE_COUNT = 1100;

        function init3DHeart() {
            heartParticles = [];
            const scale = Math.min(width, height) / 46;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random() * Math.PI * 2;
                // v controls 3D latitude / thickness (-PI/2 to PI/2)
                const v = (Math.random() - 0.5) * Math.PI;

                const pos2D = heart2DCurve(u);
                const cosV = Math.cos(v);
                const sinV = Math.sin(v);

                // Multi-layered depth:
                // Shell layer (outside) or Core layer (inside)
                const isInner = Math.random() < 0.35;
                const innerScale = isInner ? (0.4 + Math.random() * 0.5) : (0.95 + (Math.random() - 0.5) * 0.12);

                const x = pos2D.x * (0.35 + 0.65 * cosV) * scale * innerScale;
                const y = pos2D.y * (0.35 + 0.65 * cosV) * scale * innerScale;
                const z = 14 * sinV * (0.75 + 0.25 * Math.sin(u)) * scale * innerScale;

                heartParticles.push({
                    origX: x,
                    origY: y,
                    origZ: z,
                    size: 1.2 + Math.random() * 2.5,
                    speed: 0.02 + Math.random() * 0.04,
                    phase: Math.random() * Math.PI * 2,
                    isCore: Math.random() < 0.18,
                    colorVariant: Math.random()
                });
            }
        }
        init3DHeart();

        // ================= ORBITING ENERGY COMETS =================
        const comets = [];
        const COMET_COUNT = 14;
        for (let i = 0; i < COMET_COUNT; i++) {
            comets.push({
                u: Math.random() * Math.PI * 2,
                v: (Math.random() - 0.5) * Math.PI * 0.8,
                speedU: (0.02 + Math.random() * 0.03) * (Math.random() > 0.5 ? 1 : -1),
                speedV: (Math.random() - 0.5) * 0.02,
                trail: [],
                size: 2.5 + Math.random() * 2.5
            });
        }

        // ================= FALLING ICONS (NHÃ THI AVATAR / ICON) =================
        const fallingIcons = [];
        const ICON_COUNT = 24;

        for (let i = 0; i < ICON_COUNT; i++) {
            fallingIcons.push({
                x: Math.random() * width,
                y: Math.random() * height * 1.5 - height * 0.5,
                vy: 0.8 + Math.random() * 1.6,
                vx: (Math.random() - 0.5) * 0.8,
                size: 32 + Math.random() * 32, // Avatar diameter
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.025,
                swaySpeed: 0.02 + Math.random() * 0.02,
                swayOffset: Math.random() * Math.PI * 2,
                alpha: 0.65 + Math.random() * 0.35
            });
        }

        // ================= SHOCKWAVES =================
        let shockwaves = [];
        function emitShockwave() {
            shockwaves.push({
                scale: 0.7,
                alpha: 0.85,
                speed: 0.03 + Math.random() * 0.015,
                color: curTheme.secondary
            });
        }

        // ================= SHOOTING STARS =================
        const shootingStars = [];
        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width * 0.8,
                y: Math.random() * height * 0.4,
                len: 120 + Math.random() * 100,
                speed: 12 + Math.random() * 8,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                alpha: 1
            });
        }
        setInterval(() => {
            if (Math.random() > 0.35) createShootingStar();
        }, 1800);

        // ================= CLICK BURSTS =================
        let clickBursts = [];
        function createBurst(cx, cy, count = 45) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                clickBursts.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: 0.012 + Math.random() * 0.02,
                    size: 2.2 + Math.random() * 4.5,
                    color: Math.random() > 0.5 ? curTheme.primary : curTheme.secondary,
                    isHeart: Math.random() > 0.4,
                    gravity: 0.08
                });
            }
        }

        // Mouse trail sparkles
        let mouseTrail = [];

        // ================= 3D INTERACTION & ROTATION LOGIC =================
        let autoRotate = true;
        let rotX = 0.1;
        let rotY = 0;
        let velRotX = 0;
        let velRotY = 0;

        let isDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.controls')) return;
            isDragging = true;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            velRotX = 0;
            velRotY = 0;

            createBurst(e.clientX, e.clientY, 45);
            emitShockwave();
            spawnFloatingWord(e.clientX, e.clientY);
            superPulse = 1.25;
        });

        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            if (isDragging) {
                const deltaX = e.clientX - lastPointerX;
                const deltaY = e.clientY - lastPointerY;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;

                velRotY = deltaX * 0.007;
                velRotX = -deltaY * 0.007;
                rotY += velRotY;
                rotX += velRotX;
            }

            // Spawn mouse particle trail
            mouseTrail.push({
                x: mouseX,
                y: mouseY,
                size: 2.5 + Math.random() * 5,
                alpha: 0.9,
                isHeart: Math.random() > 0.45
            });
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        window.addEventListener('pointercancel', () => {
            isDragging = false;
        });

        // Floating sweet words
        const sweetWords = [
            "Nhã Thi ❤️", "Dễ Thương ✨", "Xinh Đẹp 🌸", "Yêu Em 💖",
            "Hạnh Phúc 🌟", "Rạng Ngời 💕", "Bình Yên 🕊️", "Tỏa Sáng ✨",
            "Always With You 💫", "Thi Của Anh 🌹"
        ];

        function spawnFloatingWord(x, y) {
            const wordEl = document.createElement('div');
            wordEl.className = 'floating-word';
            wordEl.innerText = sweetWords[Math.floor(Math.random() * sweetWords.length)];
            wordEl.style.left = `${x}px`;
            wordEl.style.top = `${y}px`;
            wordEl.style.color = curTheme.secondary;
            wordEl.style.textShadow = `0 0 15px ${curTheme.primary}, 0 0 25px ${curTheme.glow}`;
            document.body.appendChild(wordEl);

            setTimeout(() => {
                wordEl.remove();
            }, 1800);
        }

        // ================= DRAW MINI HEART HELPER =================
        function drawMiniHeart(ctx, x, y, size, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size / 10, size / 10);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-5, -6, -10, 0, 0, 10);
            ctx.bezierCurveTo(10, 0, 5, -6, 0, 0);
            ctx.fillStyle = color;
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.restore();
        }

        // ================= DRAW FALLING ICON (AVATAR BADGE) =================
        function drawFallingIcon(ctx, icon) {
            ctx.save();
            ctx.translate(icon.x, icon.y);
            ctx.rotate(icon.rotation);
            ctx.globalAlpha = icon.alpha;

            const radius = icon.size / 2;

            // Outer glowing border
            ctx.shadowBlur = 16;
            ctx.shadowColor = curTheme.primary;
            ctx.beginPath();
            ctx.arc(0, 0, radius + 2.5, 0, Math.PI * 2);
            ctx.fillStyle = curTheme.secondary;
            ctx.fill();

            // Clip inner circle for image
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.clip();

            if (isIconLoaded) {
                ctx.drawImage(customIconImg, -radius, -radius, icon.size, icon.size);
            } else {
                // Placeholder gradient if loading
                const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
                grad.addColorStop(0, curTheme.primary);
                grad.addColorStop(1, curTheme.secondary);
                ctx.fillStyle = grad;
                ctx.fillRect(-radius, -radius, icon.size, icon.size);
            }

            ctx.restore();
        }

        // ================= MAIN ANIMATION LOOP =================
        let time = 0;
        let superPulse = 0;
        let lastBeatState = false;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.035;

            // 3D rotation physics
            if (autoRotate && !isDragging) {
                rotY += 0.009; // Smooth continuous 3D spin
            }
            if (!isDragging) {
                // Apply inertia decay
                rotY += velRotY;
                rotX += velRotX;
                velRotY *= 0.94;
                velRotX *= 0.94;

                // Gentle spring back on X axis so it doesn't flip upside down
                rotX += (0.08 - rotX) * 0.02;
            }

            if (superPulse > 0) superPulse *= 0.94;

            // Heartbeat Lub-Dub
            const sinVal = Math.sin(time * 2.2);
            const beat1 = Math.pow(Math.max(0, sinVal), 16) * 0.16;
            const beat2 = Math.pow(Math.max(0, Math.sin(time * 2.2 + 0.45)), 18) * 0.10;
            const currentHeartBeat = beat1 + beat2 + superPulse;

            if (currentHeartBeat > 0.12 && !lastBeatState) {
                emitShockwave();
            }
            lastBeatState = (currentHeartBeat > 0.12);

            const scaleFactor = 1 + currentHeartBeat;

            // Keep typography centered with soft 3D tilt
            centerContainer.style.transform = `
                translate(-50%, -50%) 
                scale(${scaleFactor * 0.98}) 
                rotateX(${rotX * 14}deg) 
                rotateY(${Math.sin(rotY) * 14}deg)
            `;

            // Clear canvas
            ctx.fillStyle = 'rgba(3, 0, 9, 0.28)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // 1. Shooting Stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.alpha -= 0.02;

                if (ss.alpha <= 0) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - Math.cos(ss.angle) * ss.len, ss.y - Math.sin(ss.angle) * ss.len);
                ctx.strokeStyle = `rgba(255, 255, 255, ${ss.alpha})`;
                ctx.lineWidth = 1.8;
                ctx.shadowBlur = 10;
                ctx.shadowColor = curTheme.primary;
                ctx.stroke();
                ctx.restore();
            }

            // 2. Central Nebula Glow
            const nebula = ctx.createRadialGradient(
                centerX, centerY, 20,
                centerX, centerY, 330 * scaleFactor
            );
            nebula.addColorStop(0, curTheme.glow.replace('0.9', '0.36'));
            nebula.addColorStop(0.5, curTheme.glow.replace('0.9', '0.12'));
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 360 * scaleFactor, 0, Math.PI * 2);
            ctx.fill();

            // 3. Falling Custom Icons
            for (let i = 0; i < fallingIcons.length; i++) {
                const icon = fallingIcons[i];
                icon.y += icon.vy;
                icon.x += icon.vx + Math.sin(time + icon.swayOffset) * 0.6;
                icon.rotation += icon.rotSpeed;

                if (icon.y > height + icon.size) {
                    icon.y = -icon.size - 20;
                    icon.x = Math.random() * width;
                }

                drawFallingIcon(ctx, icon);
            }

            // 4. Expanding Heart Shockwaves
            const heartScaleBase = Math.min(width, height) / 46;
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.scale += sw.speed;
                sw.alpha -= 0.022;

                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                const totalPoints = 80;
                for (let j = 0; j <= totalPoints; j++) {
                    const t = (Math.PI * 2 * j) / totalPoints;
                    const pt = heart2DCurve(t);
                    
                    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                    const cosX = Math.cos(rotX);

                    let x = pt.x * heartScaleBase * sw.scale * cosY;
                    let y = pt.y * heartScaleBase * sw.scale * cosX;

                    if (j === 0) ctx.moveTo(centerX + x, centerY + y);
                    else ctx.lineTo(centerX + x, centerY + y);
                }
                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = sw.alpha;
                ctx.lineWidth = 2.2;
                ctx.shadowBlur = 18;
                ctx.shadowColor = curTheme.primary;
                ctx.stroke();
                ctx.restore();
            }

            // 5. 3D Particle Heart Points
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

            for (let i = 0; i < heartParticles.length; i++) {
                const p = heartParticles[i];
                p.phase += p.speed;

                const wiggle = Math.sin(p.phase) * 2.5;
                let curX = (p.origX + wiggle) * scaleFactor;
                let curY = (p.origY + wiggle) * scaleFactor;
                let curZ = p.origZ;

                // 3D rotation math
                // Rotate Y
                let x1 = curX * cosY - curZ * sinY;
                let z1 = curZ * cosY + curX * sinY;
                // Rotate X
                let y1 = curY * cosX - z1 * sinX;
                let z2 = z1 * cosX + curY * sinX;

                // Perspective projection factor
                const fov = 750;
                const perspective = fov / (fov + z2);
                const screenX = centerX + x1 * perspective;
                const screenY = centerY + y1 * perspective;

                // Subtle cursor gravitational attraction
                const dx = mouseX - screenX;
                const dy = mouseY - screenY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let finalX = screenX;
                let finalY = screenY;

                if (dist < 130) {
                    const force = (1 - dist / 130) * 8;
                    finalX += (dx / dist) * force;
                    finalY += (dy / dist) * force;
                }

                const blink = 0.5 + 0.5 * Math.sin(time * 3 + p.phase);
                const depthAlpha = Math.max(0.15, Math.min(1, (z2 + 160) / 260));
                const finalAlpha = depthAlpha * blink;

                ctx.save();
                ctx.beginPath();
                ctx.arc(finalX, finalY, p.size * perspective * (1 + currentHeartBeat * 0.8), 0, Math.PI * 2);

                if (p.isCore) {
                    ctx.fillStyle = curTheme.core;
                } else if (p.colorVariant > 0.5) {
                    ctx.fillStyle = curTheme.primary;
                } else {
                    ctx.fillStyle = curTheme.secondary;
                }

                ctx.globalAlpha = finalAlpha;
                ctx.shadowBlur = 14;
                ctx.shadowColor = curTheme.shadow;
                ctx.fill();
                ctx.restore();
            }

            // 6. Orbiting Energy Comets around 3D heart
            for (let i = 0; i < comets.length; i++) {
                const c = comets[i];
                c.u += c.speedU;
                c.v += c.speedV;

                const pos2D = heart2DCurve(c.u);
                const cosV = Math.cos(c.v);
                const sinV = Math.sin(c.v);

                const cx0 = pos2D.x * (0.35 + 0.65 * cosV) * heartScaleBase * scaleFactor;
                const cy0 = pos2D.y * (0.35 + 0.65 * cosV) * heartScaleBase * scaleFactor;
                const cz0 = 15 * sinV * (0.75 + 0.25 * Math.sin(c.u)) * heartScaleBase * scaleFactor;

                // 3D Rotate
                let cx1 = cx0 * cosY - cz0 * sinY;
                let cz1 = cz0 * cosY + cx0 * sinY;
                let cy1 = cy0 * cosX - cz1 * sinX;
                let cz2 = cz1 * cosX + cy0 * sinX;

                const fov = 750;
                const perspective = fov / (fov + cz2);
                const px = centerX + cx1 * perspective;
                const py = centerY + cy1 * perspective;

                c.trail.push({ x: px, y: py });
                if (c.trail.length > 18) c.trail.shift();

                // Draw trail ribbon
                ctx.save();
                for (let t = 0; t < c.trail.length - 1; t++) {
                    const p1 = c.trail[t];
                    const p2 = c.trail[t + 1];
                    const trAlpha = (t / c.trail.length) * 0.75;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = curTheme.secondary;
                    ctx.globalAlpha = trAlpha;
                    ctx.lineWidth = (t / c.trail.length) * (c.size * 1.8);
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = curTheme.primary;
                    ctx.stroke();
                }

                // Comet head
                ctx.beginPath();
                ctx.arc(px, py, c.size * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 20;
                ctx.shadowColor = curTheme.primary;
                ctx.fill();
                ctx.restore();
            }

            // 7. Mouse Pointer Trail
            for (let i = mouseTrail.length - 1; i >= 0; i--) {
                const tr = mouseTrail[i];
                tr.alpha -= 0.028;
                tr.size *= 0.95;

                if (tr.alpha <= 0) {
                    mouseTrail.splice(i, 1);
                    continue;
                }

                if (tr.isHeart) {
                    drawMiniHeart(ctx, tr.x, tr.y, tr.size * 1.8, curTheme.secondary, tr.alpha);
                } else {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(tr.x, tr.y, tr.size, 0, Math.PI * 2);
                    ctx.fillStyle = curTheme.primary;
                    ctx.globalAlpha = tr.alpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = curTheme.secondary;
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 8. Click Bursts
            for (let i = clickBursts.length - 1; i >= 0; i--) {
                const cb = clickBursts[i];
                cb.x += cb.vx;
                cb.y += cb.vy;
                cb.vy += cb.gravity;
                cb.alpha -= cb.decay;

                if (cb.alpha <= 0) {
                    clickBursts.splice(i, 1);
                    continue;
                }

                if (cb.isHeart) {
                    drawMiniHeart(ctx, cb.x, cb.y, cb.size * 2.2, cb.color, cb.alpha);
                } else {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cb.x, cb.y, cb.size, 0, Math.PI * 2);
                    ctx.fillStyle = cb.color;
                    ctx.globalAlpha = cb.alpha;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = cb.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        animate();

        // ================= BUTTON CONTROLS =================
        // Theme Switcher
        document.getElementById('themeBtn').addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
            createBurst(width / 2, height / 2, 50);
            emitShockwave();
        });

        // Super Beat
        document.getElementById('superBeatBtn').addEventListener('click', () => {
            superPulse = 1.6;
            for (let i = 0; i < 4; i++) {
                setTimeout(emitShockwave, i * 160);
            }
            createBurst(width / 2, height / 2, 60);
            spawnFloatingWord(width / 2, height / 2);
        });

        // Confetti / Heart Storm
        document.getElementById('confettiBtn').addEventListener('click', () => {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const rx = Math.random() * width;
                    const ry = Math.random() * height * 0.8 + height * 0.1;
                    createBurst(rx, ry, 10);
                    if (i % 6 === 0) spawnFloatingWord(rx, ry);
                }, i * 35);
            }
        });
    </script>
</body>
</html>
