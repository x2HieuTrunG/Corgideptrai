<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Up Script Lua</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            background-color: #0f111a;
            color: #a6accd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1a1c29;
            padding: 25px;
            border-radius: 8px;
            width: 95%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #292d3e;
        }
        h2 { margin-bottom: 20px; color: #82aaff; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #0f111a;
            color: #c3e88d;
            border: 1px solid #444267;
            border-radius: 6px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #82aaff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #c792ea;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #b074d6; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            display: none;
            background-color: #0f111a;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #c792ea;
        }
        .result-box p { margin-bottom: 10px; color: #fff; font-size: 14px;}
        .result-box input {
            width: 100%;
            padding: 10px;
            background-color: #1a1c29;
            color: #ffcb6b;
            border: 1px solid #444267;
            border-radius: 4px;
            font-family: inherit;
        }
        .btn-copy { background-color: #82aaff; margin-top: 10px; }
        .btn-copy:hover { background-color: #6994ec; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Up Script Loadstring 🔥</h2>
        <textarea id="scriptInput" placeholder="-- Dán mã nguồn Lua của bạn vào đây..."></textarea>
        <button id="uploadBtn">Tạo Link Loadstring</button>

        <div class="result-box" id="resultBox">
            <p>Thành công! Copy lệnh dưới đây để chạy trong game:</p>
            <input type="text" id="linkOutput" readonly>
            <button class="btn-copy" id="copyBtn">Copy Lệnh</button>
        </div>
    </div>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const scriptInput = document.getElementById('scriptInput');
        const resultBox = document.getElementById('resultBox');
        const linkOutput = document.getElementById('linkOutput');

        uploadBtn.addEventListener('click', async () => {
            const code = scriptInput.value.trim();
            if (!code) {
                alert('Vui lòng nhập code trước khi up!');
                return;
            }

            // Đổi trạng thái nút
            uploadBtn.textContent = 'Đang xử lý...';
            uploadBtn.disabled = true;

            try {
                // Đóng gói dữ liệu để gửi lên dpaste (API lưu code miễn phí)
                const formData = new URLSearchParams();
                formData.append('content', code);
                formData.append('syntax', 'lua');
                formData.append('expiry_days', '365'); // Lưu tối đa 1 năm (tùy chính sách dpaste)

                // Gửi request trực tiếp từ trình duyệt
                const response = await fetch('https://dpaste.com/api/v2/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });
                
                // dpaste sẽ trả về một link dạng: https://dpaste.com/XYZ123
                const link = await response.text(); 
                
                // Để lấy raw text, chỉ cần thêm .txt vào cuối link
                const rawLink = link.trim() + '.txt';
                
                // Lắp ráp thành câu lệnh loadstring hoàn chỉnh
                const loadstringCommand = `loadstring(game:HttpGet("${rawLink}"))()`;
                
                // Hiển thị ra màn hình
                linkOutput.value = loadstringCommand;
                resultBox.style.display = 'block';
                
            } catch (error) {
                alert('Lỗi mạng hoặc API đang bận. Vui lòng thử lại!');
                console.error(error);
            } finally {
                // Trả lại trạng thái nút ban đầu
                uploadBtn.textContent = 'Tạo Link Loadstring';
                uploadBtn.disabled = false;
            }
        });

        // Xử lý nút Copy
        copyBtn.addEventListener('click', () => {
            linkOutput.select();
            document.execCommand('copy');
            copyBtn.textContent = '✔️ Đã Copy!';
            setTimeout(() => { copyBtn.textContent = 'Copy Lệnh'; }, 2000);
        });
    </script>

</body>
</html>
