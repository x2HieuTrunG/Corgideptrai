<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - My Script Hub</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        p { margin-bottom: 20px; }
        .code-box {
            background-color: #010409;
            padding: 15px;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #7ee787;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 BÁ BẠO HUB SCRIPT 🔥</h1>
        <p>Copy lệnh dưới đây và dán vào Executor của bạn để chạy!</p>
        
        <!-- Ô chứa lệnh loadstring -->
        <div class="code-box" id="codeText">
            loadstring(game:HttpGet(window.location.href + "script.lua"))()
        </div>

        <button onclick="copyCode()" id="copyBtn">📋 Copy Lệnh</button>
    </div>

    <script>
        // Tự động cập nhật link theo tên miền web của bạn
        const codeBox = document.getElementById('codeText');
        const loadstringCmd = `loadstring(game:HttpGet("${window.location.href}script.lua"))()`;
        codeBox.innerText = loadstringCmd;

        // Chức năng copy
        function copyCode() {
            navigator.clipboard.writeText(loadstringCmd);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✔️ Đã Copy!";
            setTimeout(() => { btn.innerText = "📋 Copy Lệnh"; }, 2000);
        }
    </script>

</body>
</html>
